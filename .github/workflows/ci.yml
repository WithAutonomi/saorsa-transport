# CI - the pull request gate
#
# Every check a PR needs runs here, and `CI Gate` summarises them. Suites that
# only run on a schedule or by hand live elsewhere: tests.yml (extended property
# tests), platforms.yml (full target matrix), platforms-exotic.yml, and
# security.yml (cargo audit/deny, on Cargo changes and daily). See
# .github/CI_ARCHITECTURE.md.

name: CI

on:
  pull_request:
    branches: [master, main, "rc-*"]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick checks - format, lint, compile, licence headers
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Clippy portable WebRTC profile
        run: cargo clippy -p saorsa-transport --lib --no-default-features --features webrtc -- -D warnings

      - name: Build check
        run: cargo check --lib --bins --examples

      - name: Build for WASM
        run: |
          cargo check --lib --no-default-features --target wasm32-unknown-unknown
          cargo check -p saorsa-transport --lib --no-default-features --features webrtc --target wasm32-unknown-unknown

      - name: Check licence headers
        run: |
          # Every tracked Rust file must open one of the licence headers in use
          # within its first 15 lines: the crate's MIT OR Apache-2.0 notice (in
          # either wording or as an SPDX identifier), or the Chromium or
          # Cloudflare BSD notice kept on the vendored quiche files. Code under
          # any other terms needs review, and its header line added below.
          headers='^// (This software is licensed under the MIT license <LICENSE-MIT or|Licensed under the MIT license <https://opensource\.org/licenses/MIT> or the|SPDX-License-Identifier: MIT OR Apache-2\.0|Use of this source code is governed by a BSD-style license that can be|Redistribution and use in source and binary forms, with or without)$'
          checked=0
          missing_headers=0
          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            if ! head -n 15 -- "$file" | grep -E "$headers" > /dev/null; then
              echo "::error file=$file::Missing license header"
              missing_headers=$((missing_headers + 1))
            fi
          done < <(git ls-files -z -- '*.rs')

          if [ "$checked" -eq 0 ]; then
            echo "::error::No tracked .rs files found"
            exit 1
          fi
          if [ "$missing_headers" -gt 0 ]; then
            echo "::error::Found $missing_headers files without license headers"
            exit 1
          fi

  # Main test suite (Linux): every feature profile, every test target
  test:
    name: Test Suite
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib --bins --examples

      - name: Run library tests
        run: cargo test --lib --all-features -- --test-threads=2

      - name: Run library tests (no default features)
        run: cargo test --lib --no-default-features -- --test-threads=2

      - name: Run portable WebRTC profile tests
        run: 'cargo test -p saorsa-transport --lib --no-default-features --features webrtc webrtc::'

      # Every integration test target (`--test '*'`; the lib tests ran above).
      - name: Run integration tests
        run: cargo test --all-features --test '*' -- --test-threads=2

      - name: Run doc tests
        run: cargo test --doc

  # Windows and macOS: default features, lib + quick integration tests
  test-os:
    name: Tests (${{ matrix.os }})
    needs: quick-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        # bash on Windows too: a multi-line pwsh step only fails on its last command
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64-apple-darwin target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Run library tests
        run: cargo test --lib -- --test-threads=2

      - name: Run integration tests
        run: |
          cargo test --test quick -- --test-threads=2
          cargo test --test auto_binding_integration -- --test-threads=2

      # macos-latest is arm64; the release also ships x86_64-apple-darwin
      - name: Build for x86_64-apple-darwin
        if: runner.os == 'macOS'
        run: cargo build --target x86_64-apple-darwin --all-features --lib --bins --examples

  # MSRV verification
  msrv:
    name: MSRV (1.95.0)
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install MSRV
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check MSRV
        run: |
          cargo check --all-features
          cargo check --no-default-features

  # CI gate - all required jobs must pass
  ci-success:
    name: CI Gate
    needs: [quick-checks, test, test-os, msrv]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "### CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Checks | ${{ needs.quick-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Windows, macOS) | ${{ needs.test-os.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MSRV | ${{ needs.msrv.result }} |" >> $GITHUB_STEP_SUMMARY

          # Required jobs
          if [[ "${{ needs.quick-checks.result }}" != "success" ]]; then
            echo "::error::Quick checks failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Test suite failed"
            exit 1
          fi
          if [[ "${{ needs.test-os.result }}" != "success" ]]; then
            echo "::error::Windows/macOS tests failed"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "::error::MSRV check failed"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All CI checks passed!**" >> $GITHUB_STEP_SUMMARY
