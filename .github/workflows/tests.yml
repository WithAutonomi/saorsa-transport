# Tests - extended property tests, weekly and on demand
#
# PR tests (lib, integration, doc, Windows and macOS) run in ci.yml. This
# workflow only runs the long property-test pass that is too slow for every PR.

name: Tests

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Extended tests weekly on Mondays at 4 AM UTC
    - cron: '0 4 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Extended property tests
  extended-property-tests:
    name: Extended Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: proptest-extended

      - name: Run extended property tests
        run: cargo test --test property_tests --release -- --test-threads=8
        env:
          PROPTEST_CASES: 1024
          PROPTEST_MAX_SHRINK_ITERS: 50000

      - name: Upload regression files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: proptest-regressions/
