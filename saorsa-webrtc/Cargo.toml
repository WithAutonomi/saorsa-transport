[package]
name = "saorsa-webrtc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WithAutonomi/saorsa-transport"
description = "Portable WebRTC Direct profile and application wire contract for Saorsa"
keywords = ["webrtc", "p2p", "protocol", "wasm"]
categories = ["network-programming", "wasm"]

[dependencies]
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
fips203 = { version = "0.4.3", default-features = false, features = ["default-rng", "ml-kem-768"] }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
saorsa-pqc = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_const_for_fn = "allow"
