[package]
name = "saorsa-webrtc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WithAutonomi/saorsa-transport"
description = "Portable WebRTC Direct profile and application wire contract for Saorsa"
keywords = ["webrtc", "p2p", "protocol", "wasm"]
categories = ["network-programming", "wasm"]

[dependencies]
saorsa-pqc = { version = "0.5", git = "https://github.com/saorsa-labs/saorsa-pqc", rev = "6d57e9dd73d537182fe85b0050e809a224f21154", default-features = false }
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hex = "0.4"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
zeroize = { version = "1.8", default-features = false }


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_const_for_fn = "allow"
